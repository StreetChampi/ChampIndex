<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Champi -- Back-office</title><style>
:root{--p:#f3eadb;--w:#fffaf1;--i:#302a22;--m:#5b684d;--l:#d1bea1;--b:#58758a;--r:#a75532}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Arial,sans-serif}header{background:#3d4935;color:#fff;padding:18px}h1,h2,h3{font-family:Georgia,serif}header h1{margin:0 0 5px}header p{margin:0;opacity:.8;font-size:13px}nav{padding:12px;background:var(--w);border-bottom:1px solid var(--l);display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e3dacb;color:var(--i)}button.primary{background:var(--m);color:#fff}button.blue{background:var(--b);color:#fff}button.red{background:var(--r);color:#fff}main{max-width:1500px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}@media(max-width:950px){.layout{grid-template-columns:1fr}}.panel{background:var(--w);border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:18px}.tree{overflow:auto}.tree ul{list-style:none;padding-left:22px;border-left:1px solid var(--l)}.tree>ul{padding-left:0;border:0}.tree li{margin:7px 0}.node{display:inline-block;padding:8px 10px;border:1px solid var(--l);border-radius:11px;cursor:pointer}.q{background:#e1e8d8}.g{background:#e0e9ee}.s{background:#f1ddd2}.sel{outline:3px solid #b9c79e}.muted{color:#756957;font-size:13px}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#ddd4c5}.choices{margin-top:12px}.choice{border:1px solid var(--l);border-radius:12px;padding:11px;margin:8px 0;background:#fbf6ed}.choice input{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px;font:inherit}textarea{min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:0 0 auto}.callout{padding:11px;background:#e0e9ee;border-left:4px solid var(--b);border-radius:8px;font-size:13px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#eee6d9;border-radius:12px;padding:10px 14px}.stat b{font:700 22px Georgia,serif;display:block}hr{border:0;border-top:1px solid var(--l);margin:18px 0}.tax ul{list-style:none;padding-left:20px}.tax li{margin:7px 0}
</style></head><body><header><h1>Champi -- construire l'arbre</h1><p>Ajoute des ramifications et crée les espèces finales sans modifier le code à la main.</p></header><nav><button class="tab active" data-v="tree">🌿 Arbre</button><button class="tab" data-v="tax">🧬 Taxonomie</button><button class="tab" data-v="pub">⇩ Publier</button></nav><main id="app"></main><script src="data.js"></script><script>
const D=window.CHAMPI_DATA;D.groups=D.groups||{};let sel={t:'q',id:D.start},view='tree';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qid=()=>`q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,gid=()=>`g_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,sid=()=>`espece_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`;
const isQ=id=>!!D.nodes[id],isS=id=>!!D.results[id],isG=id=>!!D.groups[id];
function target(o){return typeof o.next==='string'?o.next:(o.next?.result||o.next?.group||'')}function typ(id){return isQ(id)?'q':isS(id)?'s':isG(id)?'g':''}function label(id){if(!id)return'aucune cible';if(isQ(id))return D.nodes[id].question||id;if(isS(id))return D.results[id].genus||id;if(isG(id))return D.groups[id].name||id;return id}
function choose(t,id){sel={t,id};view='tree';render()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));view==='tree'?tree():view==='tax'?tax():pub()}
function tree(){let a=document.getElementById('app');a.innerHTML=`<div class="stats"><div class="stat">Questions<b>${Object.keys(D.nodes).length}</b></div><div class="stat">Groupes<b>${Object.keys(D.groups).length}</b></div><div class="stat">Espèces<b>${Object.keys(D.results).length}</b></div></div><div class="layout"><section class="panel"><h2>Arbre de décision</h2><p class="muted">Clique une question, un groupe ou une espèce. Puis affine-la depuis le panneau de droite.</p><div class="tree">${treeNode(D.start,new Set())}</div></section><section class="panel"><h2>Construire</h2>${editor()}</section></div>`}
function treeNode(id,seen){if(seen.has(id))return'<li>↻ boucle</li>';seen.add(id);if(isS(id)){return `<li><span class="node s ${sel.id===id?'sel':''}" onclick="choose('s','${esc(id)}')">🍄 ${esc(label(id))} <span class="badge">ESPÈCE</span></span></li>`}if(isG(id)){let g=D.groups[id];return `<li><span class="node g ${sel.id===id?'sel':''}" onclick="choose('g','${esc(id)}')">🌱 ${esc(g.name||id)} <span class="badge">GROUPE</span></span>${g.root?'<ul>'+treeNode(g.root,new Set(seen))+'</ul>':''}</li>`}if(!isQ(id))return`<li>⚠ cible absente ${esc(id)}</li>`;let n=D.nodes[id];return `<li><span class="node q ${sel.id===id?'sel':''}" onclick="choose('q','${esc(id)}')">❓ ${esc(n.question||id)} <span class="badge">QUESTION</span></span><ul>${(n.options||[]).map((o,i)=>`<li><span class="muted">${i+1}. ${esc(o.label)} → ${esc(label(target(o)))}</span>${target(o)?treeNode(target(o),new Set(seen)):''}</li>`).join('')}</ul></li>`}
function editor(){if(sel.t==='q'&&isQ(sel.id))return qedit(sel.id);if(sel.t==='g'&&isG(sel.id))return gedit(sel.id);if(sel.t==='s'&&isS(sel.id))return sedit(sel.id);return'<p class="muted">Sélectionne un élément.</p>'}
function qedit(id){let n=D.nodes[id];return `<div class="callout"><b>Chaque réponse peut maintenant devenir une ramification.</b><br>Tu peux créer directement une question, un groupe intermédiaire ou une fiche espèce.</div><label>Question</label><textarea id="qt">${esc(n.question)}</textarea><label>Indice / aide</label><textarea id="qh">${esc(n.hint||'')}</textarea><h3>Réponses</h3><div class="choices">${(n.options||[]).map((o,i)=>choice(o,i)).join('')}</div><div class="row"><button onclick="addChoice()">+ Réponse</button><button class="primary" onclick="saveQ('${esc(id)}')">Enregistrer</button></div>`}
function choice(o,i){let t=target(o),ty=typ(t);return `<div class="choice"><input data-l="${i}" value="${esc(o.label)}"><div class="muted" style="margin-top:6px">Destination : <b>${esc(label(t))}</b></div><div class="actions">${t?`<button class="blue" onclick="choose('${ty}','${esc(t)}')">Ouvrir</button>`:''}${t&&ty==='s'?`<button onclick="refine('${esc(t)}')">Affiner ce résultat</button>`:''}${t&&ty==='g'?`<button onclick="startGroup('${esc(t)}')">Affiner ce groupe</button>`:''}<button onclick="newQHere(${i})">→ Nouvelle question ici</button><button onclick="newGHere(${i})">→ Nouveau groupe</button><button onclick="newSHere(${i})">→ Nouvelle espèce</button><button onclick="delChoice(${i})">Supprimer</button></div></div>`}
function saveQ(id){let n=D.nodes[id];n.question=document.getElementById('qt').value.trim();n.hint=document.getElementById('qh').value.trim();n.options=n.options.map((o,i)=>({...o,label:document.querySelector(`[data-l="${i}"]`).value.trim()}));render()}function addChoice(){D.nodes[sel.id].options.push({label:'Nouvelle réponse',next:''});render()}function delChoice(i){D.nodes[sel.id].options.splice(i,1);render()}
function newQHere(i){let id=qid();D.nodes[id]={question:'Nouvelle question',hint:'',options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.nodes[sel.id].options[i].next=id;sel={t:'q',id};render()}
function newGHere(i){let id=gid();D.groups[id]={name:'Nouveau groupe',note:'',root:''};D.nodes[sel.id].options[i].next={group:id};sel={t:'g',id};render()}
function newSHere(i){let id=sid();D.results[id]={genus:'Nouvelle espèce',family:'',genusTax:'',note:''};D.nodes[sel.id].options[i].next={result:id};sel={t:'s',id};render()}
function startGroup(id){let g=D.groups[id];if(!g.root){let q=qid();D.nodes[q]={question:'Nouvelle question',hint:'',options:[{label:'Oui',next:''},{label:'Non',next:''}]};g.root=q}sel={t:'q',id:g.root};render()}
function refine(id){let old=D.results[id],g=gid(),q=qid();D.groups[g]={name:old.genus||'Groupe à affiner',note:'Ancien résultat transformé en groupe intermédiaire.',root:q};D.nodes[q]={question:'Nouvelle question',hint:'',options:[{label:'Oui',next:{result:id}},{label:'Non',next:''}]};for(let n of Object.values(D.nodes))for(let o of n.options||[])if(target(o)===id)o.next={group:g};sel={t:'q',id:q};render()}
function gedit(id){let g=D.groups[id];return `<div class="callout"><b>Groupe intermédiaire</b><br>Il sert à regrouper une famille de résultats avant de descendre jusqu'aux espèces.</div><label>Nom du groupe</label><input id="gn" value="${esc(g.name||'')}"><label>Note</label><textarea id="go">${esc(g.note||'')}</textarea><div class="row"><button class="primary" onclick="saveG('${esc(id)}')">Enregistrer</button><button onclick="startGroup('${esc(id)}')">+ Première question</button></div>`}
function saveG(id){D.groups[id].name=document.getElementById('gn').value.trim();D.groups[id].note=document.getElementById('go').value.trim();render()}
function sedit(id){let r=D.results[id];return `<div class="callout"><b>Fiche espèce</b><br>Elle devient une feuille finale de l'arbre. Si elle est encore trop générale, utilise « Affiner cette espèce ».</div><label>Nom</label><input id="sn" value="${esc(r.genus||r.name||'')}"><label>Famille</label><input id="sf" value="${esc(r.family||'')}"><label>Genre</label><input id="st" value="${esc(r.genusTax||'')}"><label>Caractères distinctifs</label><textarea id="so">${esc(r.note||'')}</textarea><div class="row"><button class="primary" onclick="saveS('${esc(id)}')">Enregistrer</button><button onclick="refine('${esc(id)}')">Affiner cette espèce</button></div>`}
function saveS(id){let r=D.results[id];r.genus=document.getElementById('sn').value.trim();r.family=document.getElementById('sf').value.trim();r.genusTax=document.getElementById('st').value.trim();r.note=document.getElementById('so').value.trim();render()}
function tax(){let g={};for(let[id,r]of Object.entries(D.results)){let f=r.family||'À classer',ge=r.genusTax||'Genre non renseigné';(g[f]??={})[ge]??=[];g[f][ge].push([id,r])}document.getElementById('app').innerHTML=`<section class="panel"><h2>Vue taxonomique</h2><p class="muted">Famille → genre → espèces.</p><div class="tax">${Object.entries(g).sort().map(([f,gs])=>`<h3>🌿 ${esc(f)}</h3><ul>${Object.entries(gs).sort().map(([ge,a])=>`<li><b>${esc(ge)}</b><ul>${a.map(([id,r])=>`<li><button onclick="choose('s','${esc(id)}')">🍄 ${esc(r.genus||id)}</button></li>`).join('')}</ul></li>`).join('')}</ul>`).join('')}</div></section>`}
function pub(){document.getElementById('app').innerHTML=`<section class="panel"><h2>Publier</h2><p>1. Télécharge <b>data.js</b> 2. remplace l'ancien dans GitHub 3. GitHub Pages publie les nouvelles ramifications.</p><button class="primary" onclick="download()">⇩ Télécharger data.js</button></section>`}function download(){let b=new Blob([`/* Champi -- données générées par le back-office */\nwindow.CHAMPI_DATA = ${JSON.stringify(D,null,2)};\n`],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});render();
</script></body></html>
