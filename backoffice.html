<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champi — Back-office</title>
<style>
:root{--p:#f3eadb;--w:#fffaf1;--i:#302a22;--m:#5b684d;--l:#d1bea1;--b:#58758a;--r:#a75532;--ok:#687b53;--shadow:0 10px 30px rgba(63,48,32,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--p);color:var(--i);font:15px Arial,sans-serif}header{background:#3d4935;color:#fff;padding:18px;position:sticky;top:0;z-index:20}h1,h2,h3{font-family:Georgia,serif}header h1{margin:0 0 5px}header p{margin:0;opacity:.8;font-size:13px}nav{padding:10px;background:var(--w);border-bottom:1px solid var(--l);display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:73px;z-index:19}button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e3dacb;color:var(--i)}button.primary{background:var(--m);color:#fff}button.blue{background:var(--b);color:#fff}button.red{background:var(--r);color:#fff}button.green{background:var(--ok);color:#fff}button.small{padding:5px 8px;font-size:12px}.tab.active{outline:2px solid #b9c79e}.dirty{color:#9b4f32;font-weight:700;align-self:center}main{max-width:1550px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}@media(max-width:950px){.layout{grid-template-columns:1fr}nav{top:67px}}.panel{background:var(--w);border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}.tree{overflow:auto;min-height:300px}.tree ul{list-style:none;padding-left:22px;border-left:1px solid var(--l)}.tree>ul{padding-left:0;border:0}.tree li{margin:7px 0}.node{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--l);border-radius:11px;cursor:pointer;max-width:100%}.node:hover{filter:brightness(.98)}.q{background:#e1e8d8}.g{background:#e0e9ee}.s{background:#f1ddd2}.complete{border-color:#748c5e!important}.incomplete{border-color:#c9876c!important}.sel{outline:3px solid #b9c79e}.muted{color:#756957;font-size:13px}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#ddd4c5;white-space:nowrap}.badge.q{background:#d9e4cf}.badge.g{background:#d7e3e9}.badge.ok{background:#dce8cc}.badge.warn{background:#efd0c2}.choices{margin-top:12px}.choice{border:1px solid var(--l);border-radius:12px;padding:11px;margin:8px 0;background:#fbf6ed}.choice input,.choice select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.choice-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px;font:inherit}textarea{min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap}.callout{padding:11px;background:#e0e9ee;border-left:4px solid var(--b);border-radius:8px;font-size:13px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#eee6d9;border-radius:12px;padding:10px 14px}.stat b{font:700 22px Georgia,serif;display:block}hr{border:0;border-top:1px solid var(--l);margin:18px 0}.tax ul{list-style:none;padding-left:20px}.tax li{margin:7px 0}.sticky-editor{position:sticky;top:145px;max-height:calc(100vh - 165px);overflow:auto;padding-right:3px}.confusion{border:1px solid var(--l);background:#fbf6ed;border-radius:12px;padding:10px;margin:8px 0}.dest-box{margin-top:8px;padding:10px;background:#f4eddf;border-radius:10px}.dest-row{display:flex;gap:7px;align-items:center;margin-top:7px}.dest-row select{flex:1}.dest-tag{font-size:12px;font-weight:700;color:#5d5445}.species-picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:5px;margin-top:8px;max-height:190px;overflow:auto}.species-pick{display:flex;gap:7px;align-items:center;padding:6px 8px;background:#fffaf1;border-radius:8px}.species-pick input{width:auto}.modal-backdrop{position:fixed;inset:0;background:rgba(32,25,17,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);background:var(--w);border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h2{margin-top:0}.status{position:fixed;right:16px;bottom:16px;background:#3d4935;color:#fff;padding:10px 13px;border-radius:12px;z-index:120;display:none}.status.show{display:block}.top{position:fixed;right:16px;bottom:68px;z-index:30;border-radius:99px;background:#3d4935;color:#fff;display:none}.top.show{display:block}.empty{padding:25px;text-align:center;color:#756957}.tax-family{margin-top:18px}.tax-genus{margin-left:18px}.tax-species{margin-left:36px;display:flex;gap:6px;flex-wrap:wrap}.mini-link{background:#eee6d9}.branch-tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<header><h1>🍄 Champi — Back-office</h1><p>Construis l'arbre, enrichis les fiches et publie <code>data.js</code>.</p></header>
<nav>
<button class="tab active" data-v="tree">🌿 Arbre</button>
<button class="tab" data-v="tax">🧬 Taxonomie</button>
<button class="tab" data-v="pub">⇩ Publier</button>
<button onclick="undo()">↶ Annuler</button><button onclick="redo()">↷ Rétablir</button>
<span id="dirty" class="dirty"></span>
</nav>
<main id="app"></main>
<button id="top" class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Haut</button>
<div id="status" class="status"></div>
<div id="modal-backdrop" class="modal-backdrop" onclick="if(event.target===this)closeValueModal()"><div id="modal" class="modal"></div></div>
<script src="data.js"></script>
<script>
const D=window.CHAMPI_DATA;D.groups=D.groups||{};D.nodes=D.nodes||{};D.results=D.results||{};
let sel={t:'q',id:D.start},view='tree',undoStack=[],redoStack=[],collapsed=JSON.parse(localStorage.getItem('champiCollapsed')||'{}'),dirty=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isQ=id=>!!D.nodes[id],isS=id=>!!D.results[id],isG=id=>!!D.groups[id];
const qid=()=>`q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,sid=()=>`espece_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,gid=()=>`groupe_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`;
function destIds(next){if(typeof next==='string')return [next];if(!next)return[];if(next.result)return[next.result];if(Array.isArray(next.results))return next.results.filter(Boolean);if(next.group&&D.groups[next.group]?.root)return[D.groups[next.group].root];if(next.question)return[next.question];return[]}
function rawDestIds(next){if(typeof next==='string')return [next];if(!next)return[];if(next.result)return[next.result];if(Array.isArray(next.results))return next.results.filter(Boolean);if(next.group)return[next.group];if(next.question)return[next.question];return[]}
function targetLabel(id){if(!id)return'aucune destination';if(isQ(id))return'❓ '+(D.nodes[id].question||id);if(isS(id))return'🍄 '+(D.results[id].genus||id);if(isG(id))return'🌱 '+(D.groups[id].name||id);return'⚠ '+id}
function snap(){return JSON.stringify(D)}
function mark(){dirty=true;saveDraft();document.getElementById('dirty').textContent='● Modifications non publiées'}
function mutate(){undoStack.push(snap());if(undoStack.length>80)undoStack.shift();redoStack=[];mark()}
function restore(s){const n=JSON.parse(s);Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,n);mark()}
function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop());render()}
function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop());render()}
function saveDraft(){clearTimeout(window._draft);window._draft=setTimeout(()=>localStorage.setItem('champiDraft',JSON.stringify({data:D,time:new Date().toISOString()})),100)}
function saveFormDraft(){if(sel.t==='q'&&document.getElementById('qt'))syncQForm(sel.id);else if(sel.t==='s'&&document.getElementById('sn'))syncSpeciesForm(sel.id);else saveDraft()}
function loadDraft(){try{let x=JSON.parse(localStorage.getItem('champiDraft'));if(x?.data&&confirm('Une version non publiée de ton travail a été trouvée. La restaurer ?')){Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,x.data);dirty=true;return true}}catch(e){}return false}
function flash(t){let e=document.getElementById('status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
window.addEventListener('beforeunload',e=>{saveFormDraft();if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('scroll',()=>document.getElementById('top').classList.toggle('show',scrollY>350));
function choose(t,id){sel={t,id};render(true)}
function toggle(id){collapsed[id]=!collapsed[id];localStorage.setItem('champiCollapsed',JSON.stringify(collapsed));render(true)}
function badge(t,id){if(t==='q')return'<span class="badge q">QUESTION</span>';if(t==='g')return'<span class="badge g">GROUPE À AFFINER</span>';let r=D.results[id],ok=!!(r.family&&r.genusTax&&r.edibility);return`<span class="badge ${ok?'ok':'warn'}">ESPÈCE · ${ok?'FICHE COMPLÈTE':'À COMPLÉTER'}</span>`}
function treeNode(id,seen){seen=seen||new Set();if(seen.has(id))return'<li>↻ boucle</li>';seen.add(id);
 if(isS(id)){let r=D.results[id],ok=r.family&&r.genusTax&&r.edibility;return`<li><span class="node s ${ok?'complete':'incomplete'} ${sel.id===id?'sel':''}" onclick="choose('s','${esc(id)}')">🍄 ${esc(r.genus||id)} ${badge('s',id)}</span></li>`}
 if(isG(id)){let g=D.groups[id],open=!collapsed[id];return`<li><span class="node g ${sel.id===id?'sel':''}" onclick="choose('g','${esc(id)}')">🌱 ${esc(g.name||id)} ${badge('g',id)}</span> <button class="small" onclick="event.stopPropagation();toggle('${esc(id)}')">${open?'▾':'▸'}</button>${open&&g.root?`<ul>${treeNode(g.root,new Set(seen))}</ul>`:''}</li>`}
 if(!isQ(id))return`<li>⚠ cible absente ${esc(id)}</li>`;let n=D.nodes[id],open=!collapsed[id];return`<li><span class="node q ${sel.id===id?'sel':''}" onclick="choose('q','${esc(id)}')">❓ ${esc(n.question||id)} ${badge('q',id)}</span> <button class="small" onclick="event.stopPropagation();toggle('${esc(id)}')">${open?'▾':'▸'}</button>${open?`<ul>${(n.options||[]).map((o,i)=>`<li><span class="muted">${i+1}. ${esc(o.label)} → </span>${destIds(o.next).length?destIds(o.next).map(x=>treeNode(x,new Set(seen))).join(''): '<span class="muted">(aucune destination)</span>'}</li>`).join('')}</ul>`:''}</li>`}
function stats(){let n=Object.keys(D.nodes).length,g=Object.keys(D.groups).length,s=Object.keys(D.results).length,c=Object.values(D.results).filter(r=>r.family&&r.genusTax&&r.edibility).length;return`<div class="stats"><div class="stat">Questions<b>${n}</b></div><div class="stat">Groupes à affiner<b>${g}</b></div><div class="stat">Espèces<b>${s}</b></div><div class="stat">Fiches complètes<b>${c}/${s}</b></div></div>`}
function tree(){document.getElementById('app').innerHTML=stats()+`<div class="layout"><section class="panel"><h2>Arbre de décision</h2><p class="muted">Les groupes sont des repères éditoriaux. Lorsqu'un groupe possède une première question, l'application passe directement à cette question. Tu peux retirer le groupe sans supprimer sa branche.</p><div class="tree"><ul>${treeNode(D.start,new Set())}</ul></div></section><section class="panel" id="editor"><div class="sticky-editor"><h2>Édition</h2>${editor()}</div></section></div>`}
function editor(){if(sel.t==='q'&&isQ(sel.id))return qedit(sel.id);if(sel.t==='g'&&isG(sel.id))return gedit(sel.id);if(sel.t==='s'&&isS(sel.id))return sedit(sel.id);return'<p class="muted">Sélectionne un élément.</p>'}
function syncQForm(id){let n=D.nodes[id];if(!n)return;let q=document.getElementById('qt'),h=document.getElementById('qh');if(q)n.question=q.value.trim();if(h)n.hint=h.value.trim();document.querySelectorAll('.choice input[data-i]').forEach(x=>{if(n.options[+x.dataset.i])n.options[+x.dataset.i].label=x.value.trim()});saveDraft()}
function qedit(id){let n=D.nodes[id];return`<div class="callout"><b>Question</b><br>Tu peux modifier les réponses sans perdre les textes déjà saisis. Les champs sont aussi sauvegardés localement pendant la saisie.</div><label>Question</label><textarea id="qt" oninput="saveFormDraft()">${esc(n.question)}</textarea><label>Aide / indice</label><textarea id="qh" oninput="saveFormDraft()">${esc(n.hint||'')}</textarea><h3>Réponses</h3><div class="choices">${(n.options||[]).map((o,i)=>choiceEditor(id,o,i)).join('')}</div><div class="row"><button onclick="addOpt()">+ Ajouter une réponse</button><button class="primary" onclick="saveQ('${esc(id)}')">Enregistrer</button><button class="red" onclick="delQ('${esc(id)}')">Supprimer cette question</button></div>`}
function choiceEditor(qid_,o,i){return`<div class="choice"><input data-i="${i}" value="${esc(o.label)}" oninput="saveFormDraft()"><div class="dest-box"><div class="dest-tag">Destination(s)</div>${destinationEditor(qid_,i,o.next)}</div><div class="choice-actions"><button class="small" onclick="delOpt(${i})">Supprimer la réponse</button></div></div>`}
function destinationEditor(qid_,i,next){let raw=rawDestIds(next);let type=next?.group?'group':next?.question||isQ(raw[0])?'question':raw.length?'species':'none';let opts='';
 if(type==='question'){opts=Object.entries(D.nodes).sort((a,b)=>(a[1].question||'').localeCompare(b[1].question||'','fr')).map(([id,n])=>`<option value="${esc(id)}" ${raw[0]===id?'selected':''}>${esc(n.question||id)}</option>`).join('');return`<select onchange="setQuestionDest(${i},this.value)"><option value="">Choisir une question…</option>${opts}</select><div class="branch-tools"><button class="small blue" onclick="newQuestionForChoice(${i})">+ Nouvelle question</button><button class="small" onclick="setNoneDest(${i})">Aucune</button></div>`}
 if(type==='group'){opts=Object.entries(D.groups).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||'','fr')).map(([id,g])=>`<option value="${esc(id)}" ${raw[0]===id?'selected':''}>${esc(g.name||id)}</option>`).join('');return`<select onchange="setGroupDest(${i},this.value)"><option value="">Choisir un groupe…</option>${opts}</select><div class="branch-tools"><button class="small blue" onclick="newGroupForChoice(${i})">+ Nouveau groupe</button><button class="small" onclick="setNoneDest(${i})">Aucune</button></div>`}
 if(type==='species'){let picks=Object.entries(D.results).sort((a,b)=>(a[1].genus||'').localeCompare(b[1].genus||'','fr')).map(([id,r])=>`<label class="species-pick"><input type="checkbox" value="${esc(id)}" ${raw.includes(id)?'checked':''} onchange="toggleSpeciesDest(${i},this)">${esc(r.genus||id)}</label>`).join('');return`<div class="species-picks">${picks}</div><div class="branch-tools"><button class="small blue" onclick="newSpeciesForChoice(${i})">+ Nouvelle espèce</button><button class="small" onclick="setNoneDest(${i})">Aucune</button></div><p class="muted">Tu peux cocher plusieurs espèces si une réponse ne permet plus de les distinguer.</p>`}
 return`<select onchange="setDestKind(${i},this.value)"><option value="none" selected>Aucune destination…</option><option value="question">Une question existante</option><option value="species">Une ou plusieurs espèces</option><option value="group">Un groupe à affiner</option></select>`}
function saveQ(id){mutate();syncQForm(id);render(true);flash('Question enregistrée')}
function addOpt(){syncQForm(sel.id);mutate();D.nodes[sel.id].options.push({label:'Nouvelle réponse',next:''});render(true)}
function delOpt(i){syncQForm(sel.id);mutate();D.nodes[sel.id].options.splice(i,1);render(true)}
function setNoneDest(i){syncQForm(sel.id);mutate();D.nodes[sel.id].options[i].next='';render(true)}
function setQuestionDest(i,id){syncQForm(sel.id);mutate();D.nodes[sel.id].options[i].next=id||'';render(true)}
function setGroupDest(i,id){syncQForm(sel.id);mutate();D.nodes[sel.id].options[i].next=id?{group:id}:'';render(true)}
function setDestKind(i,k){if(k==='none')return setNoneDest(i);if(k==='question')return newQuestionForChoice(i);if(k==='species')return newSpeciesForChoice(i);if(k==='group')return newGroupForChoice(i)}
function toggleSpeciesDest(i,box){syncQForm(sel.id);mutate();let cur=rawDestIds(D.nodes[sel.id].options[i].next).filter(id=>isS(id));if(box.checked&&!cur.includes(box.value))cur.push(box.value);if(!box.checked)cur=cur.filter(id=>id!==box.value);D.nodes[sel.id].options[i].next=cur.length===0?'':cur.length===1?{result:cur[0]}:{results:cur};render(true)}
function newQuestionForChoice(i){syncQForm(sel.id);mutate();let id=qid();D.nodes[id]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.nodes[sel.id].options[i].next=id;sel={t:'q',id};render(true)}
function newGroupForChoice(i){syncQForm(sel.id);mutate();let id=gid(),q=qid();D.groups[id]={name:'Nouveau groupe',note:'',root:q};D.nodes[q]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.nodes[sel.id].options[i].next={group:id};sel={t:'g',id};render(true)}
function newSpeciesForChoice(i){syncQForm(sel.id);mutate();let id=sid();D.results[id]={genus:'Nouvelle espèce',family:'',genusTax:'',edibility:'',note:'',confusions:[]};D.nodes[sel.id].options[i].next={result:id};sel={t:'s',id};render(true)}
function delQ(id){if(id===D.start)return alert('La question de départ ne peut pas être supprimée.');if(!confirm('Supprimer cette question ? La suppression est annulable.'))return;mutate();for(const n of Object.values(D.nodes))for(const o of n.options||[]){if(typeof o.next==='string'&&o.next===id)o.next='';if(o.next?.question===id)o.next='';}for(const g of Object.values(D.groups))if(g.root===id)g.root='';delete D.nodes[id];sel={t:'q',id:D.start};render(true)}
function gedit(id){let g=D.groups[id];return`<div class="callout"><b>🌱 Groupe à affiner</b><br>Repère éditorial : sa première question est utilisée directement par l'application.</div><label>Nom</label><input id="gn" value="${esc(g.name||'')}" oninput="saveFormDraft()"><label>Note</label><textarea id="go" oninput="saveFormDraft()">${esc(g.note||'')}</textarea><div class="row">${g.root?`<button class="blue" onclick="choose('q','${esc(g.root)}')">Ouvrir la première question</button>`:`<button onclick="startG('${esc(id)}')">+ Première question</button>`}<button class="primary" onclick="saveG('${esc(id)}')">Enregistrer</button><button class="red" onclick="delG('${esc(id)}')">Retirer le groupe, conserver la branche</button></div><p class="muted">« Retirer le groupe » ne supprime aucune question ni espèce. Le choix parent sera relié directement à la première question de cette branche.</p>`}
function saveG(id){mutate();D.groups[id].name=document.getElementById('gn').value.trim();D.groups[id].note=document.getElementById('go').value.trim();render(true)}
function startG(id){mutate();let q=qid();D.nodes[q]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.groups[id].root=q;sel={t:'q',id:q};render(true)}
function delG(id){let root=D.groups[id]?.root;if(!confirm('Retirer ce groupe de l’arbre ? Les questions et espèces qu’il contient seront conservées.'))return;mutate();for(const n of Object.values(D.nodes))for(const o of n.options||[])if(o.next?.group===id)o.next=root||'';delete D.groups[id];sel=root?{t:'q',id:root}:{t:'q',id:D.start};render(true)}
function taxonomyOptions(field,current){let vals=[...new Set(Object.values(D.results).map(r=>r[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));return`<option value="">À renseigner</option>${vals.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}<option value="__new__">+ Créer une nouvelle valeur…</option>`}
function sedit(id){let r=D.results[id],ok=r.family&&r.genusTax&&r.edibility,conf=Array.isArray(r.confusions)?r.confusions:[];return`<div class="callout"><b>🍄 Fiche espèce — ${ok?'✓ complète':'⚠ à compléter'}</b><br>Le couple « confondu avec + indice » n'apparaît au front que lorsque l'autre espèce est aussi une piste.</div><label>Nom</label><input id="sn" value="${esc(r.genus||r.name||'')}" oninput="saveFormDraft()"><label>Famille</label><select id="sf" onchange="taxonomySelectChanged('sf','family')">${taxonomyOptions('family',r.family)}</select><label>Genre</label><select id="st" onchange="taxonomySelectChanged('st','genusTax')">${taxonomyOptions('genusTax',r.genusTax)}</select><label>Comestibilité</label><select id="se" onchange="saveFormDraft()"><option value="">À renseigner</option><option value="edible" ${r.edibility==='edible'?'selected':''}>Comestible réputée (à confirmer)</option><option value="caution" ${r.edibility==='caution'?'selected':''}>Comestibilité délicate / prudence</option><option value="inedible" ${r.edibility==='inedible'?'selected':''}>Non comestible</option><option value="toxic" ${r.edibility==='toxic'?'selected':''}>Toxique</option><option value="deadly" ${r.edibility==='deadly'?'selected':''}>Mortelle / potentiellement mortelle</option><option value="unknown" ${r.edibility==='unknown'?'selected':''}>Inconnue</option></select><label>Caractères distinctifs</label><textarea id="so" oninput="saveFormDraft()">${esc(r.note||'')}</textarea><h3>Si confondu avec…</h3><p class="muted">Choisis une autre espèce et indique librement le détail qui permet de les départager. Si l'indice est vide, rien n'est affiché au résultat.</p><div id="conf">${conf.map((c,i)=>confHTML(c,i,id)).join('')}</div><button onclick="addConf()">+ Ajouter une confusion</button><div class="row" style="margin-top:12px"><button class="primary" onclick="saveS('${esc(id)}')">Enregistrer</button><button onclick="refine('${esc(id)}')">Affiner cette espèce</button><button class="red" onclick="delS('${esc(id)}')">Supprimer cette espèce</button></div>`}
function taxonomySelectChanged(selectId,field){let el=document.getElementById(selectId);if(el.value==='__new__')openValueModal(field,selectId);else saveFormDraft()}
function confHTML(c,i,self){let opts=Object.entries(D.results).filter(([id])=>id!==self).sort((a,b)=>(a[1].genus||'').localeCompare(b[1].genus||'','fr')).map(([id,r])=>`<option value="${esc(id)}" ${id===c.with?'selected':''}>${esc(r.genus||id)}</option>`).join('');return`<div class="confusion"><select data-ci="${i}" class="cw"><option value="">Choisir une espèce…</option>${opts}</select><label>Indice de détermination</label><textarea data-cclue="${i}" placeholder="Ex. Observez surtout la forme des écailles…" oninput="saveFormDraft()">${esc(c.clue||'')}</textarea><button class="small" onclick="delConf(${i})">Supprimer</button></div>`}
function addConf(){syncSpeciesForm(sel.id);mutate();D.results[sel.id].confusions.push({with:'',clue:''});render(true)}function delConf(i){syncSpeciesForm(sel.id);mutate();D.results[sel.id].confusions.splice(i,1);render(true)}
function syncSpeciesForm(id){let r=D.results[id];if(!r)return;let sn=document.getElementById('sn'),sf=document.getElementById('sf'),st=document.getElementById('st'),se=document.getElementById('se'),so=document.getElementById('so');if(sn)r.genus=sn.value.trim();if(sf&&sf.value!=='__new__')r.family=sf.value;if(st&&st.value!=='__new__')r.genusTax=st.value;if(se)r.edibility=se.value;if(so)r.note=so.value.trim();if(document.querySelector('#conf'))r.confusions=[...document.querySelectorAll('#conf .confusion')].map(e=>({with:e.querySelector('.cw').value,clue:e.querySelector('[data-cclue]').value.trim()}));saveDraft()}
function saveS(id){mutate();syncSpeciesForm(id);D.results[id].confusions=(D.results[id].confusions||[]).filter(x=>x.with);render(true);flash('Fiche espèce enregistrée')}
function refine(id){syncSpeciesForm(id);mutate();let old=D.results[id],g=gid(),q=qid();D.groups[g]={name:old.genus||'Groupe à affiner',note:'Ancien résultat transformé en groupe intermédiaire.',root:q};D.nodes[q]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:{result:id}},{label:'Non',next:''}]};for(const n of Object.values(D.nodes))for(const o of n.options||[])if((typeof o.next==='string'&&o.next===id)||(o.next?.result===id))o.next={group:g};sel={t:'q',id:q};render(true)}
function delS(id){if(!confirm('Supprimer cette espèce ? La suppression est annulable.'))return;mutate();delete D.results[id];for(const n of Object.values(D.nodes))for(const o of n.options||[]){if(o.next?.result===id)o.next='';if(Array.isArray(o.next?.results)){o.next.results=o.next.results.filter(x=>x!==id);if(o.next.results.length===1)o.next={result:o.next.results[0]};if(o.next.results.length===0)o.next=''}}for(const r of Object.values(D.results))r.confusions=(r.confusions||[]).filter(c=>c.with!==id);sel={t:'q',id:D.start};render(true)}
function tax(){let g={};for(let[id,r]of Object.entries(D.results)){let f=r.family||'À renseigner',ge=r.genusTax||'Genre non renseigné';(g[f]??={})[ge]??=[];g[f][ge].push([id,r])}document.getElementById('app').innerHTML=`<div class="layout"><section class="panel"><h2>Vue taxonomique</h2><p class="muted">Famille → genre → espèces. Clique une espèce pour l'éditer sans perdre ta position dans l'arbre.</p>${Object.entries(g).sort().map(([f,gs])=>`<div class="tax-family"><h3>🌿 ${esc(f)}</h3>${Object.entries(gs).sort().map(([ge,a])=>`<div class="tax-genus"><b>↳ ${esc(ge)}</b><div class="tax-species">${a.map(([id,r])=>`<button class="mini-link" onclick="choose('s','${esc(id)}')">${r.family&&r.genusTax&&r.edibility?'✓':'⚠'} ${esc(r.genus||id)}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}</section><section class="panel" id="editor"><div class="sticky-editor"><h2>Édition</h2>${sel.t==='s'&&isS(sel.id)?sedit(sel.id):'<p class="muted">Sélectionne une espèce dans la taxonomie.</p>'}</div></section></div>`}
function pub(){document.getElementById('app').innerHTML=`<section class="panel"><h2>Publier</h2><p>Le travail est sauvegardé automatiquement dans ce navigateur pendant que tu travailles. Tu peux donc fermer/recharger la page sans perdre les modifications non publiées.</p><button class="primary" onclick="download()">⇩ Télécharger data.js</button> <button onclick="clearDraft()">Effacer la sauvegarde locale</button><hr><p>${Object.keys(D.nodes).length} questions · ${Object.keys(D.groups).length} groupes · ${Object.keys(D.results).length} espèces.</p></section>`}
function download(){let b=new Blob(['/* Champi — données générées par le back-office */\nwindow.CHAMPI_DATA = '+JSON.stringify(D,null,2)+';\n'],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dirty=false;document.getElementById('dirty').textContent='';clearDraft();flash('data.js téléchargé')}
function clearDraft(){localStorage.removeItem('champiDraft');flash('Sauvegarde locale effacée')}
function openValueModal(field,selectId){let label=field==='family'?'Nouvelle famille':'Nouveau genre';document.getElementById('modal').innerHTML=`<h2>${label}</h2><p class="muted">La nouvelle valeur sera immédiatement disponible dans le menu déroulant.</p><label>Nom</label><input id="new-value" autofocus><div class="row" style="margin-top:14px"><button onclick="closeValueModal(true,'${selectId}')">Annuler</button><button class="primary" onclick="confirmValue('${field}','${selectId}')">Créer</button></div>`;document.getElementById('modal-backdrop').classList.add('open');setTimeout(()=>document.getElementById('new-value')?.focus(),20)}
function confirmValue(field,selectId){let v=document.getElementById('new-value').value.trim();if(!v)return;let selEl=document.getElementById(selectId);if(selEl){let opt=document.createElement('option');opt.value=v;opt.textContent=v;opt.selected=true;selEl.insertBefore(opt,selEl.querySelector('option[value="__new__"]'))}if(field==='family')D.results[sel.id].family=v;else D.results[sel.id].genusTax=v;mark();closeValueModal();flash('Valeur créée')}
function closeValueModal(cancel=false,selectId=''){document.getElementById('modal-backdrop').classList.remove('open');if(cancel&&selectId){let el=document.getElementById(selectId);if(el)el.value=sel.t==='s'?(fieldValue(sel.id,selectId)):''}}
function fieldValue(id,selectId){let r=D.results[id];return selectId==='sf'?(r.family||''):(r.genusTax||'')}
function render(keepScroll=true){let y=scrollY;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));view==='tree'?tree():view==='tax'?tax():pub();if(keepScroll)scrollTo(0,y)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;render(false)});
if(!loadDraft())saveDraft();render(false);
</script>
</body></html>
