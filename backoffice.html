<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Champi — Back-office</title><style>
:root{--p:#f3eadb;--w:#fffaf1;--i:#302a22;--m:#5b684d;--l:#d1bea1;--b:#58758a;--r:#a75532;--ok:#687b53}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Arial,sans-serif}header{background:#3d4935;color:#fff;padding:18px;position:sticky;top:0;z-index:20}h1,h2,h3{font-family:Georgia,serif}header h1{margin:0 0 5px}header p{margin:0;opacity:.8;font-size:13px}nav{padding:10px;background:var(--w);border-bottom:1px solid var(--l);display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:73px;z-index:19}button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e3dacb;color:var(--i)}button.primary{background:var(--m);color:#fff}button.blue{background:var(--b);color:#fff}button.red{background:var(--r);color:#fff}button.green{background:var(--ok);color:#fff}button.small{padding:5px 8px;font-size:12px}main{max-width:1550px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}@media(max-width:950px){.layout{grid-template-columns:1fr}nav{top:67px}}.panel{background:var(--w);border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:18px}.tree{overflow:auto}.tree ul{list-style:none;padding-left:22px;border-left:1px solid var(--l)}.tree>ul{padding-left:0;border:0}.tree li{margin:7px 0}.node{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--l);border-radius:11px;cursor:pointer}.q{background:#e1e8d8}.g{background:#e0e9ee}.s{background:#f1ddd2}.complete{border-color:#748c5e!important}.incomplete{border-color:#c9876c!important}.sel{outline:3px solid #b9c79e}.muted{color:#756957;font-size:13px}.badge{font-size:10px;padding:3px 6px;border-radius:99px;background:#ddd4c5}.badge.q{background:#d9e4cf}.badge.g{background:#d7e3e9}.badge.ok{background:#dce8cc}.badge.warn{background:#efd0c2}.choices{margin-top:12px}.choice{border:1px solid var(--l);border-radius:12px;padding:11px;margin:8px 0;background:#fbf6ed}.choice input{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:9px;font:inherit}textarea{min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap}.callout{padding:11px;background:#e0e9ee;border-left:4px solid var(--b);border-radius:8px;font-size:13px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#eee6d9;border-radius:12px;padding:10px 14px}.stat b{font:700 22px Georgia,serif;display:block}hr{border:0;border-top:1px solid var(--l);margin:18px 0}.tax ul{list-style:none;padding-left:20px}.tax li{margin:7px 0}.sticky-editor{position:sticky;top:145px;max-height:calc(100vh - 165px);overflow:auto;padding-right:3px}.confusion{border:1px solid var(--l);background:#fbf6ed;border-radius:12px;padding:10px;margin:8px 0}.status{position:fixed;right:16px;bottom:16px;background:#3d4935;color:#fff;padding:10px 13px;border-radius:12px;z-index:50;display:none}.status.show{display:block}.top{position:fixed;right:16px;bottom:68px;z-index:30;border-radius:99px;background:#3d4935;color:#fff;display:none}.top.show{display:block}.dirty{color:#9b4f32;font-weight:700}
</style></head><body><header><h1>🍄 Champi — Back-office</h1><p>Construis l’arbre, enrichis les fiches et publie <code>data.js</code>.</p></header><nav><button class="tab active" data-v="tree">🌿 Arbre</button><button class="tab" data-v="tax">🧬 Taxonomie</button><button class="tab" data-v="pub">⇩ Publier</button><button onclick="undo()">↶ Annuler</button><button onclick="redo()">↷ Rétablir</button><span id="dirty" class="dirty"></span></nav><main id="app"></main><button id="top" class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Haut</button><div id="status" class="status"></div><script src="data.js"></script><script>
const D=window.CHAMPI_DATA;D.groups=D.groups||{};D.nodes=D.nodes||{};D.results=D.results||{};let sel={t:'q',id:D.start},view='tree',undoStack=[],redoStack=[],collapsed=JSON.parse(localStorage.getItem('champiCollapsed')||'{}'),dirty=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const isQ=id=>!!D.nodes[id],isS=id=>!!D.results[id],isG=id=>!!D.groups[id];const target=o=>typeof o.next==='string'?o.next:(o.next?.result||o.next?.group||'');const typ=id=>isQ(id)?'q':isS(id)?'s':isG(id)?'g':'';const label=id=>!id?'aucune cible':isQ(id)?D.nodes[id].question||id:isS(id)?D.results[id].genus||id:isG(id)?D.groups[id].name||id:id;
const qid=()=>`q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,sid=()=>`espece_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`,gid=()=>`groupe_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,6)}`;
function snap(){return JSON.stringify(D)}function mark(){dirty=true;saveDraft();document.getElementById('dirty').textContent='● Modifications non publiées'}function mutate(){undoStack.push(snap());if(undoStack.length>80)undoStack.shift();redoStack=[];mark()}function restore(s){const n=JSON.parse(s);Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,n);mark()}function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop());render()}function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop());render()}
function saveDraft(){clearTimeout(window._draft);window._draft=setTimeout(()=>localStorage.setItem('champiDraft',JSON.stringify({data:D,time:new Date().toISOString()})),150)}function loadDraft(){try{let x=JSON.parse(localStorage.getItem('champiDraft'));if(x?.data&&confirm('Une version non publiée de ton travail a été trouvée. La restaurer ?')){Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,x.data);dirty=true;return true}}catch(e){}return false}function flash(t){let e=document.getElementById('status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});window.addEventListener('scroll',()=>document.getElementById('top').classList.toggle('show',scrollY>350));
function choose(t,id){sel={t,id};render();setTimeout(()=>document.getElementById('editor')?.scrollIntoView({behavior:'smooth',block:'start'}),30)}function toggle(id){collapsed[id]=!collapsed[id];localStorage.setItem('champiCollapsed',JSON.stringify(collapsed));render()}
function badge(t,id){if(t==='q')return '<span class="badge q">QUESTION</span>';if(t==='g')return '<span class="badge g">GROUPE À AFFINER</span>';let r=D.results[id],ok=!!(r.family&&r.genusTax&&r.edibility);return `<span class="badge ${ok?'ok':'warn'}">ESPÈCE · ${ok?'FICHE COMPLÈTE':'À COMPLÉTER'}</span>`}
function treeNode(id,seen){seen=seen||new Set();if(seen.has(id))return '<li>↻ boucle</li>';seen.add(id);if(isS(id)){let r=D.results[id],ok=r.family&&r.genusTax&&r.edibility;return `<li><span class="node s ${ok?'complete':'incomplete'} ${sel.id===id?'sel':''}" onclick="choose('s','${esc(id)}')">🍄 ${esc(r.genus||id)} ${badge('s',id)}</span></li>`}if(isG(id)){let g=D.groups[id],open=!collapsed[id];return `<li><span class="node g ${sel.id===id?'sel':''}" onclick="choose('g','${esc(id)}')">🌱 ${esc(g.name||id)} ${badge('g',id)}</span> <button class="small" onclick="event.stopPropagation();toggle('${esc(id)}')">${open?'▾':'▸'}</button>${open&&g.root?`<ul>${treeNode(g.root,new Set(seen))}</ul>`:''}</li>`}if(!isQ(id))return `<li>⚠ cible absente ${esc(id)}</li>`;let n=D.nodes[id],open=!collapsed[id];return `<li><span class="node q ${sel.id===id?'sel':''}" onclick="choose('q','${esc(id)}')">❓ ${esc(n.question||id)} ${badge('q',id)}</span> <button class="small" onclick="event.stopPropagation();toggle('${esc(id)}')">${open?'▾':'▸'}</button>${open?`<ul>${(n.options||[]).map((o,i)=>`<li><span class="muted">${i+1}. ${esc(o.label)} → </span>${treeNode(target(o),new Set(seen))}</li>`).join('')}</ul>`:''}</li>`}
function tree(){let a=document.getElementById('app');let n=Object.keys(D.nodes).length,g=Object.keys(D.groups).length,s=Object.keys(D.results).length,c=Object.values(D.results).filter(r=>r.family&&r.genusTax&&r.edibility).length;a.innerHTML=`<div class="stats"><div class="stat">Questions<b>${n}</b></div><div class="stat">Groupes à affiner<b>${g}</b></div><div class="stat">Espèces<b>${s}</b></div><div class="stat">Fiches complètes<b>${c}/${s}</b></div></div><div class="layout"><section class="panel"><h2>Arbre de décision</h2><p class="muted">▾ / ▸ replie ou ouvre une branche.</p><div class="tree"><ul>${treeNode(D.start,new Set())}</ul></div></section><section class="panel" id="editor"><div class="sticky-editor"><h2>Édition</h2>${editor()}</div></section></div>`}
function editor(){if(sel.t==='q'&&isQ(sel.id))return qedit(sel.id);if(sel.t==='g'&&isG(sel.id))return gedit(sel.id);if(sel.t==='s'&&isS(sel.id))return sedit(sel.id);return '<p class="muted">Sélectionne un élément.</p>'}
function qedit(id){let n=D.nodes[id];return `<div class="callout"><b>Question</b><br>Tu peux supprimer une réponse ou supprimer la question entière. Les modifications sont sauvegardées localement pendant ton travail.</div><label>Question</label><textarea id="qt">${esc(n.question)}</textarea><label>Aide / indice</label><textarea id="qh">${esc(n.hint||'')}</textarea><h3>Réponses</h3><div class="choices">${(n.options||[]).map((o,i)=>`<div class="choice"><input data-i="${i}" value="${esc(o.label)}"><div class="muted" style="margin-top:7px">Destination : <b>${esc(label(target(o)))}</b></div><div class="actions"><button class="small blue" onclick="choose('${typ(target(o))}','${esc(target(o))}')">Ouvrir</button><button class="small" onclick="newQ(${i})">→ Question ici</button><button class="small" onclick="newG(${i})">→ Groupe</button><button class="small" onclick="newS(${i})">→ Espèce</button><button class="small" onclick="delOpt(${i})">Supprimer la réponse</button></div></div>`).join('')}</div><div class="row"><button onclick="addOpt()">+ Ajouter une réponse</button><button class="primary" onclick="saveQ('${esc(id)}')">Enregistrer</button><button class="red" onclick="delQ('${esc(id)}')">Supprimer cette question</button></div>`}
function saveQ(id){mutate();let n=D.nodes[id];n.question=document.getElementById('qt').value.trim();n.hint=document.getElementById('qh').value.trim();document.querySelectorAll('.choice input').forEach(x=>n.options[+x.dataset.i].label=x.value.trim());render();flash('Question enregistrée')}
function addOpt(){mutate();D.nodes[sel.id].options.push({label:'Nouvelle réponse',next:''});render()}function delOpt(i){mutate();D.nodes[sel.id].options.splice(i,1);render()}
function newQ(i){mutate();let id=qid();D.nodes[id]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.nodes[sel.id].options[i].next=id;sel={t:'q',id};render()}
function newG(i){mutate();let id=gid();D.groups[id]={name:'Nouveau groupe',note:'',root:''};D.nodes[sel.id].options[i].next={group:id};sel={t:'g',id};render()}
function newS(i){mutate();let id=sid();D.results[id]={genus:'Nouvelle espèce',family:'',genusTax:'',edibility:'',note:'',confusions:[]};D.nodes[sel.id].options[i].next={result:id};sel={t:'s',id};render()}
function delQ(id){if(id===D.start)return alert('La question de départ ne peut pas être supprimée.');if(!confirm('Supprimer cette question ? La suppression est annulable.'))return;mutate();for(const n of Object.values(D.nodes))for(const o of n.options||[])if(target(o)===id)o.next='';for(const g of Object.values(D.groups))if(g.root===id)g.root='';delete D.nodes[id];sel={t:'q',id:D.start};render()}
function gedit(id){let g=D.groups[id];return `<div class="callout"><b>🌱 Groupe à affiner</b><br>Une ramification intermédiaire, pas une espèce finale.</div><label>Nom</label><input id="gn" value="${esc(g.name||'')}"><label>Note</label><textarea id="go">${esc(g.note||'')}</textarea><div class="row">${g.root?`<button class="blue" onclick="choose('q','${esc(g.root)}')">Ouvrir la première question</button>`:`<button onclick="startG('${esc(id)}')">+ Première question</button>`}<button class="primary" onclick="saveG('${esc(id)}')">Enregistrer</button><button class="red" onclick="delG('${esc(id)}')">Supprimer ce groupe</button></div>`}
function saveG(id){mutate();D.groups[id].name=document.getElementById('gn').value.trim();D.groups[id].note=document.getElementById('go').value.trim();render()}function startG(id){mutate();let q=qid();D.nodes[q]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:''},{label:'Non',next:''}]};D.groups[id].root=q;sel={t:'q',id:q};render()}
function delG(id){if(!confirm('Supprimer ce groupe et sa ramification ? La suppression est annulable.'))return;mutate();delete D.groups[id];for(const n of Object.values(D.nodes))for(const o of n.options||[])if(o.next?.group===id)o.next='';render()}
function taxonomyOptions(field,current){let vals=[...new Set(Object.values(D.results).map(r=>r[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));return `<option value="">À renseigner</option>${vals.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}<option value="__new__">+ Créer une nouvelle valeur…</option>`}
function sedit(id){let r=D.results[id],ok=r.family&&r.genusTax&&r.edibility;let conf=Array.isArray(r.confusions)?r.confusions:[];return `<div class="callout"><b>🍄 Fiche espèce — ${ok?'✓ complète':'⚠ à compléter'}</b><br>Le champ « confondu avec » ne produit un indice que si une autre espèce correspondante est également présente dans les résultats.</div><label>Nom</label><input id="sn" value="${esc(r.genus||r.name||'')}"><label>Famille</label><select id="sf">${taxonomyOptions('family',r.family)}</select><label>Genre</label><select id="st">${taxonomyOptions('genusTax',r.genusTax)}</select><label>Comestibilité</label><select id="se"><option value="">À renseigner</option><option value="edible" ${r.edibility==='edible'?'selected':''}>Comestible réputée (à confirmer)</option><option value="caution" ${r.edibility==='caution'?'selected':''}>Comestibilité délicate / prudence</option><option value="inedible" ${r.edibility==='inedible'?'selected':''}>Non comestible</option><option value="toxic" ${r.edibility==='toxic'?'selected':''}>Toxique</option><option value="deadly" ${r.edibility==='deadly'?'selected':''}>Mortelle / potentiellement mortelle</option><option value="unknown" ${r.edibility==='unknown'?'selected':''}>Inconnue</option></select><label>Caractères distinctifs</label><textarea id="so">${esc(r.note||'')}</textarea><h3>Si confondu avec…</h3><p class="muted">Choisis une autre espèce et écris le caractère à observer pour les départager. Si ce champ reste vide, aucun indice n'apparaîtra pour cette confusion.</p><div id="conf">${conf.map((c,i)=>confHTML(c,i,id)).join('')}</div><button onclick="addConf()">+ Ajouter une confusion</button><div class="row" style="margin-top:12px"><button class="primary" onclick="saveS('${esc(id)}')">Enregistrer</button><button onclick="refine('${esc(id)}')">Affiner cette espèce</button><button class="red" onclick="delS('${esc(id)}')">Supprimer cette espèce</button></div>`}
function confHTML(c,i,self){let opts=Object.entries(D.results).filter(([id])=>id!==self).sort((a,b)=>(a[1].genus||'').localeCompare(b[1].genus||'','fr')).map(([id,r])=>`<option value="${esc(id)}" ${id===c.with?'selected':''}>${esc(r.genus||id)}</option>`).join('');return `<div class="confusion"><select data-ci="${i}" class="cw"><option value="">Choisir une espèce…</option>${opts}</select><label>Indice de détermination</label><textarea data-cclue="${i}" placeholder="Ex. Observez surtout la forme des écailles…">${esc(c.clue||'')}</textarea><button class="small" onclick="delConf(${i})">Supprimer</button></div>`}
function addConf(){mutate();D.results[sel.id].confusions.push({with:'',clue:''});render()}function delConf(i){mutate();D.results[sel.id].confusions.splice(i,1);render()}
function saveS(id){mutate();let r=D.results[id];r.genus=document.getElementById('sn').value.trim();for(const [field,elid] of [['family','sf'],['genusTax','st']]){let v=document.getElementById(elid).value;if(v==='__new__'){v=prompt(field==='family'?'Nouvelle famille :':'Nouveau genre :','')||''}r[field]=v}r.edibility=document.getElementById('se').value;r.note=document.getElementById('so').value.trim();r.confusions=[...document.querySelectorAll('#conf .confusion')].map((e,i)=>({with:e.querySelector('[data-ci]').value,clue:e.querySelector('[data-cclue]').value.trim()})).filter(x=>x.with);render();flash('Fiche espèce enregistrée')}
function refine(id){mutate();let old=D.results[id],g=gid(),q=qid();D.groups[g]={name:old.genus||'Groupe à affiner',note:'Ancien résultat transformé en groupe intermédiaire.',root:q};D.nodes[q]={question:'Nouvelle question',hint:'',allowUnknown:true,options:[{label:'Oui',next:{result:id}},{label:'Non',next:''}]};for(const n of Object.values(D.nodes))for(const o of n.options||[])if(target(o)===id)o.next={group:g};sel={t:'q',id:q};render()}
function delS(id){if(!confirm('Supprimer cette espèce ? La suppression est annulable.'))return;mutate();delete D.results[id];for(const n of Object.values(D.nodes))for(const o of n.options||[])if(target(o)===id)o.next='';for(const r of Object.values(D.results))r.confusions=(r.confusions||[]).filter(c=>c.with!==id);sel={t:'q',id:D.start};render()}
function tax(){let g={};for(let[id,r]of Object.entries(D.results)){let f=r.family||'À renseigner',ge=r.genusTax||'Genre non renseigné';(g[f]??={})[ge]??=[];g[f][ge].push([id,r])}document.getElementById('app').innerHTML=`<section class="panel"><h2>Vue taxonomique</h2><p class="muted">Famille → genre → espèces. ✓ = fiche complète, ⚠ = à compléter.</p>${Object.entries(g).sort().map(([f,gs])=>`<h3>🌿 ${esc(f)}</h3><ul class="tax">${Object.entries(gs).sort().map(([ge,a])=>`<li><b>${esc(ge)}</b><ul>${a.map(([id,r])=>`<li><button onclick="choose('s','${esc(id)}')">${r.family&&r.genusTax&&r.edibility?'✓':'⚠'} ${esc(r.genus||id)}</button></li>`).join('')}</ul></li>`).join('')}</ul>`).join('')}</section>`}
function pub(){document.getElementById('app').innerHTML=`<section class="panel"><h2>Publier</h2><p>Le travail est sauvegardé automatiquement dans ce navigateur pour éviter de le perdre avec F5.</p><button class="primary" onclick="download()">⇩ Télécharger data.js</button><button onclick="clearDraft()">Effacer la sauvegarde locale</button><hr><p>${Object.keys(D.nodes).length} questions · ${Object.keys(D.groups).length} groupes · ${Object.keys(D.results).length} espèces.</p></section>`}function download(){let b=new Blob(['/* Champi — données générées par le back-office */\nwindow.CHAMPI_DATA = '+JSON.stringify(D,null,2)+';\n'],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);dirty=false;document.getElementById('dirty').textContent='';clearDraft();flash('data.js téléchargé')}
function clearDraft(){localStorage.removeItem('champiDraft');flash('Sauvegarde locale effacée')}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));view==='tree'?tree():view==='tax'?tax():pub()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});if(!loadDraft())saveDraft();render();
</script></body></html>
